<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sonavia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sonavia-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded -->
  <rect width="64" height="64" rx="18" fill="#0b0d1e" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="url(#sonavia-grad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Acoustic Sound Wave / Stylized 'S' -->
  <g filter="url(#glow)">
    <!-- Main wave curve -->
    <path d="M22 46 C 22 36, 42 36, 42 26 C 42 20, 36 17, 30 18 C 25 19, 23 23, 23 23" 
          stroke="url(#sonavia-accent)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
    <!-- Rhythm equalizer dots/bars -->
    <circle cx="21" cy="46" r="3.5" fill="#22d3ee" />
    <circle cx="43" cy="22" r="3.5" fill="#a855f7" />
    <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
    
    <!-- Subtle sound pulsation lines -->
    <path d="M14 32 C 14 26, 17 21, 20 18" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M50 32 C 50 38, 47 43, 44 46" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>
</svg>
